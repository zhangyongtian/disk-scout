name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BIN_NAME: disk-scout

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disk-scout
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: package
        shell: bash
        run: |
          cp "target/release/${BIN_NAME}" "${BIN_NAME}"
          tar -czf "${BIN_NAME}-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" "${BIN_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: disk-scout/${{ env.BIN_NAME }}-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: disk-scout
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: package
        shell: bash
        run: |
          cp "target/release/${BIN_NAME}.exe" "${BIN_NAME}.exe"
          7z a "${BIN_NAME}-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" "${BIN_NAME}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: disk-scout/${{ env.BIN_NAME }}-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: sha256
        shell: bash
        run: |
          cd dist
          sha256sum * > sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
